<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="#040914"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Sensory Aroma Waves (Olfato & Sensación) -->
  <path d="M22 24c-1.5-3.5 1-6 3-8s1-4-1-6" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M32 23c-1.5-4 1.5-7 3.5-9.5s1-4.5-1-6.5" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M42 24c-1.5-3.5 1-6 3-8s1-4-1-6" stroke="url(#accentGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Tasting Cloche / Empanada Sensory Dome (Vista & Boca) -->
  <path d="M14 42c0-9.941 8.059-18 18-18s18 8.059 18 18H14z" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Cloche Top Knob -->
  <circle cx="32" cy="23" r="3.2" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Base Plate / Sensory Tasting Line -->
  <rect x="11" y="44" width="42" height="3.5" rx="1.75" fill="url(#accentGrad)"/>
  
  <!-- Subtle Repulgue / Flavour Dots -->
  <circle cx="23" cy="38" r="1.5" fill="#0369a1"/>
  <circle cx="32" cy="36" r="1.5" fill="#0369a1"/>
  <circle cx="41" cy="38" r="1.5" fill="#0369a1"/>

  <!-- Quality Sensory Star Sparkle -->
  <path d="M49 14l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2 1.2-2.8z" fill="url(#goldGrad)"/>
</svg>